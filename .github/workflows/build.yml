name: Build Lulu Pet


on:

  workflow_dispatch:


jobs:


  build:


    runs-on: windows-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Setup Node

      uses: actions/setup-node@v4

      with:

        node-version: 20



    - name: Install

      run:

        npm install



    - name: Package

      run:

        npm run package



    - name: Upload

      uses: actions/upload-artifact@v4

      with:

        name: Lulu-Pet-Windows

        path: release/
